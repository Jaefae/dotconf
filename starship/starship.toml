# Dracula — ported from the old xonsh $PROMPT:
#   {YELLOW}{env_name} {BOLD_GREEN}{cwd} {gitstatus}{RESET} {prompt_end}
# Works identically in PowerShell, bash, zsh and fish.

add_newline = false

format = """
$python\
$directory\
$git_branch\
$git_status\
$character"""

palette = "dracula"

# Dracula palette, matching wezterm/nvim. `bg` is background; `comment` is
# the muted blue-grey used for de-emphasized text.
[palettes.dracula]
fg      = "#f8f8f2"
bg      = "#282a36"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
cyan    = "#8be9fd"
magenta = "#ff79c6"
orange  = "#ffb86c"
comment = "#6272a4"

# {BOLD_GREEN}{cwd}
[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = false

# {gitstatus}
[git_branch]
style = "magenta"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

# {YELLOW}{env_name}
[python]
style = "yellow"
format = "[${symbol}${virtualenv}]($style) "
symbol = " "

# {prompt_end}
[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
