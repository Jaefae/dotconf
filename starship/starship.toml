# Gruvbox — ported from the old xonsh $PROMPT:
#   {YELLOW}{env_name} {BOLD_GREEN}{cwd} {gitstatus}{RESET} {prompt_end}
# Works identically in PowerShell, bash, zsh and fish.

add_newline = false

format = """
$python\
$directory\
$git_branch\
$git_status\
$character"""

palette = "gruvbox"

# Gruvbox dark palette (bright variants, for contrast against bg0).
# `bg` is bg0; `comment` is gray.
[palettes.gruvbox]
fg      = "#ebdbb2"
bg      = "#282828"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
cyan    = "#8ec07c"
magenta = "#d3869b"
orange  = "#fe8019"
comment = "#928374"

# {BOLD_GREEN}{cwd}
[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = false

# {gitstatus}
[git_branch]
style = "magenta"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

# {YELLOW}{env_name}
[python]
style = "yellow"
format = "[${symbol}${virtualenv}]($style) "
symbol = " "

# {prompt_end}
[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
