# Kanagawa (dark, wave) — ported from the old xonsh $PROMPT:
#   {YELLOW}{env_name} {BOLD_GREEN}{cwd} {gitstatus}{RESET} {prompt_end}
# Works identically in PowerShell, bash, zsh and fish.

add_newline = false

format = """
$python\
$directory\
$git_branch\
$git_status\
$character"""

palette = "kanagawa_wave"

# Kanagawa "wave" palette (see rebelot/kanagawa.nvim colors.lua).
# `bg` is sumiInk3; `comment` is fujiGray.
[palettes.kanagawa_wave]
fg      = "#dcd7ba"
bg      = "#1f1f28"
red     = "#c34043"
green   = "#76946a"
yellow  = "#c0a36e"
blue    = "#7e9cd8"
cyan    = "#6a9589"
magenta = "#957fb8"
orange  = "#ffa066"
comment = "#727169"

# {BOLD_GREEN}{cwd}
[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = false

# {gitstatus}
[git_branch]
style = "magenta"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

# {YELLOW}{env_name}
[python]
style = "yellow"
format = "[${symbol}${virtualenv}]($style) "
symbol = " "

# {prompt_end}
[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
