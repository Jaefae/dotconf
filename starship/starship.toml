# Carbonfox — ported from the old xonsh $PROMPT:
#   {YELLOW}{env_name} {BOLD_GREEN}{cwd} {gitstatus}{RESET} {prompt_end}
# Works identically in PowerShell, bash, zsh and fish.

add_newline = false

format = """
$python\
$directory\
$git_branch\
$git_status\
$character"""

palette = "carbonfox"

# Carbonfox palette (see EdenEast/nightfox.nvim extra/carbonfox/*).
# `bg` is bg1; `comment` is base04/grey.
[palettes.carbonfox]
fg      = "#f2f4f8"
bg      = "#161616"
red     = "#ee5396"
green   = "#25be6a"
yellow  = "#08bdba"
blue    = "#78a9ff"
cyan    = "#33b1ff"
magenta = "#be95ff"
orange  = "#3ddbd9"
comment = "#7b7c7e"

# {BOLD_GREEN}{cwd}
[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = false

# {gitstatus}
[git_branch]
style = "magenta"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

# {YELLOW}{env_name}
[python]
style = "yellow"
format = "[${symbol}${virtualenv}]($style) "
symbol = " "

# {prompt_end}
[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
