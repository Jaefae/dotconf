# Kanagawa (dark, dragon) — ported from the old xonsh $PROMPT:
#   {YELLOW}{env_name} {BOLD_GREEN}{cwd} {gitstatus}{RESET} {prompt_end}
# Works identically in PowerShell, bash, zsh and fish.

add_newline = false

format = """
$python\
$directory\
$git_branch\
$git_status\
$character"""

palette = "kanagawa_dragon"

# Kanagawa "dragon" palette (see rebelot/kanagawa.nvim colors.lua / themes.lua).
# `bg` is dragonBlack3; `comment` is dragonAsh.
[palettes.kanagawa_dragon]
fg      = "#c5c9c5"
bg      = "#181616"
red     = "#c4746e"
green   = "#8a9a7b"
yellow  = "#c4b28a"
blue    = "#8ba4b0"
cyan    = "#8ea4a2"
magenta = "#a292a3"
orange  = "#b6927b"
comment = "#737c73"

# {BOLD_GREEN}{cwd}
[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = false

# {gitstatus}
[git_branch]
style = "magenta"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

# {YELLOW}{env_name}
[python]
style = "yellow"
format = "[${symbol}${virtualenv}]($style) "
symbol = " "

# {prompt_end}
[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
